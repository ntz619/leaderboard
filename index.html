<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leaderboard</title>
  <script src="https://portals-labs.github.io/portals-sdk/portals-sdk.js?v=10005456"></script>
  <style>
    @font-face {
      font-family: 'ObelixPro';
      src: url('https://cdn.jsdelivr.net/gh/ntz619/XP_Dashboard_prototype/obelix-pro-3.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --panel-width: min(360px, calc(100vw - 28px));
      --gold-1: #ffd437;
      --gold-2: #ffc400;
      --gold-3: #f3b004;
      --gold-4: #ffef99;
      --track-1: rgba(89, 66, 41, 0.93);
      --track-2: rgba(52, 35, 16, 0.97);
      --text-white: rgba(255, 255, 255, 0.98);
      --row-h: 30px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    body {
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
      padding: 13px 14px;
      color: var(--text-white);
      font-family: 'ObelixPro', Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
      user-select: none;
      pointer-events: auto;
    }

    .panel {
      width: var(--panel-width);
      background: linear-gradient(180deg, var(--track-1) 0%, var(--track-2) 100%);
      border-radius: 6px;
      border-top: 2px solid var(--gold-2);
      box-shadow:
        0 8px 24px rgba(0, 0, 0, 0.45),
        0 0 0 1px rgba(255, 196, 0, 0.10),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
      overflow-x: hidden;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 196, 0, 0.18) transparent;
    }

    /* ── Header ────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 8px 14px 7px;
      background: linear-gradient(180deg, rgba(255,255,255,0.05) 0%, transparent 100%);
      border-bottom: 1px solid rgba(255, 196, 0, 0.14);
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(4px);
    }
    .header-icon { font-size: 13px; line-height: 1; }
    .header-title {
      font-size: 11px;
      letter-spacing: 2.5px;
      color: var(--gold-1);
      text-shadow: 0 1px 8px rgba(255, 196, 0, 0.55), 0 0 2px rgba(255, 240, 0, 0.20);
    }

    /* ── Tabs ──────────────────────────────────── */
    .tabs {
      display: flex;
      gap: 5px;
      padding: 7px 10px 5px;
      border-bottom: 1px solid rgba(255, 196, 0, 0.08);
    }

    .tab {
      flex: 1;
      padding: 4px 0 3px;
      font-size: 8px;
      letter-spacing: 1.2px;
      text-align: center;
      border-radius: 999px;
      cursor: pointer;
      color: rgba(255, 255, 255, 0.38);
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: color 120ms, border-color 120ms, background 120ms, box-shadow 120ms;
      font-family: inherit;
    }
    .tab:hover:not(.active) {
      color: rgba(255, 255, 255, 0.68);
      border-color: rgba(255, 196, 0, 0.28);
    }
    .tab.active {
      color: #3d1a00;
      background: linear-gradient(180deg, #fff8bf 0%, #ffd64a 55%, #f2ae00 100%);
      border-color: transparent;
      box-shadow: 0 2px 8px rgba(0,0,0,0.20), 0 0 7px rgba(255,216,87,0.35);
    }

    /* ── Game filter ───────────────────────────── */
    .game-filter {
      display: flex;
      gap: 4px;
      padding: 5px 10px 5px;
      overflow-x: auto;
      scrollbar-width: none;
      border-bottom: 1px solid rgba(255, 196, 0, 0.07);
    }
    .game-filter::-webkit-scrollbar { display: none; }
    .game-filter.hidden { display: none; }

    .gf-pill {
      flex-shrink: 0;
      padding: 3px 9px 2px;
      font-size: 7px;
      letter-spacing: 0.8px;
      border-radius: 999px;
      cursor: pointer;
      color: rgba(255, 255, 255, 0.35);
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.07);
      transition: color 100ms, border-color 100ms, background 100ms, box-shadow 100ms;
      font-family: inherit;
      white-space: nowrap;
    }
    .gf-pill:hover:not(.active) {
      color: rgba(255, 255, 255, 0.65);
      border-color: rgba(255, 196, 0, 0.25);
    }
    .gf-pill.active {
      color: #3d1a00;
      background: linear-gradient(180deg, #ffe88a 0%, #ffc400 100%);
      border-color: transparent;
      box-shadow: 0 1px 6px rgba(0,0,0,0.18);
    }

    /* ── Main area ─────────────────────────────── */
    .main-area { position: relative; overflow: hidden; }
    .list-view.hidden { display: none; }

    .rows-wrap { transition: opacity 140ms ease; }
    .rows-wrap.fading { opacity: 0; }
    .rows { padding: 3px 0 3px; }

    .row {
      display: flex;
      align-items: center;
      height: var(--row-h);
      padding: 0 12px;
      gap: 8px;
      cursor: pointer;
      transition: background 120ms;
    }
    .row:nth-child(even) { background: rgba(255, 255, 255, 0.022); }
    .row:hover { background: rgba(255, 196, 0, 0.07); }
    .row.is-me {
      background: rgba(255, 196, 0, 0.09);
      border-left: 2px solid var(--gold-2);
      padding-left: 10px;
    }
    .row.is-me:hover { background: rgba(255, 196, 0, 0.14); }

    .row-rank {
      font-size: 10px;
      min-width: 24px;
      text-align: right;
      flex-shrink: 0;
      line-height: 1;
    }
    .rank-1 { color: #ffd700; text-shadow: 0 0 10px rgba(255,210,0,0.65); }
    .rank-2 { color: #c8c8c8; text-shadow: 0 0 6px rgba(200,200,200,0.40); }
    .rank-3 { color: #cd7f32; text-shadow: 0 0 7px rgba(205,127,50,0.50); }
    .rank-other { color: rgba(255,255,255,0.30); font-size: 9px; }

    .row-name {
      flex: 1;
      font-size: 9px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .you-tag { color: var(--gold-3); font-size: 7px; margin-left: 4px; opacity: 0.85; }
    .row-value { font-size: 8.5px; white-space: nowrap; color: var(--gold-4); flex-shrink: 0; }
    .row-chevron { color: rgba(255,255,255,0.18); font-size: 11px; flex-shrink: 0; }

    /* ── Own rank outside top 10 ───────────────── */
    .own-rank-sep {
      height: 1px;
      margin: 2px 12px;
      background: repeating-linear-gradient(
        90deg, rgba(255,196,0,0.22) 0px, rgba(255,196,0,0.22) 4px,
        transparent 4px, transparent 8px
      );
    }
    .own-rank-row {
      display: flex;
      align-items: center;
      height: calc(var(--row-h) - 2px);
      padding: 0 10px;
      gap: 8px;
      background: rgba(255,196,0,0.07);
      border-left: 2px solid rgba(243,176,4,0.50);
      margin-bottom: 2px;
      cursor: pointer;
      transition: background 120ms;
    }
    .own-rank-row:hover { background: rgba(255,196,0,0.12); }
    .own-rank-row .row-rank  { color: rgba(255,255,255,0.38); font-size: 9px; }
    .own-rank-row .row-name  { font-size: 9px; color: var(--gold-4); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .own-rank-row .row-value { font-size: 8.5px; color: var(--gold-4); }

    .placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 200px;
      font-size: 8px;
      letter-spacing: 1.5px;
      color: rgba(255,255,255,0.22);
    }
    .placeholder-sm {
      font-size: 7.5px;
      letter-spacing: 1px;
      color: rgba(255,255,255,0.20);
      padding: 8px 0 4px;
      text-align: center;
    }

    /* ── Detail view ───────────────────────────── */
    .detail-view { display: none; }
    .detail-view.active { display: block; }

    .detail-back {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 7px 12px 6px;
      font-size: 8px;
      letter-spacing: 1px;
      color: rgba(255,255,255,0.40);
      cursor: pointer;
      border-bottom: 1px solid rgba(255,196,0,0.08);
      transition: color 120ms;
    }
    .detail-back:hover { color: var(--gold-4); }
    .detail-back-arrow { font-size: 11px; line-height: 1; }

    .detail-hero {
      padding: 10px 14px 9px;
      border-bottom: 1px solid rgba(255,196,0,0.10);
    }
    .detail-name {
      font-size: 14px;
      color: var(--gold-1);
      text-shadow: 0 1px 6px rgba(255,196,0,0.40);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.1;
    }
    .detail-sub {
      font-size: 8px;
      color: rgba(255,255,255,0.38);
      margin-top: 4px;
      letter-spacing: 0.5px;
    }
    .detail-sub .hl { color: var(--gold-3); }

    .detail-section {
      padding: 7px 14px 6px;
      border-bottom: 1px solid rgba(255,196,0,0.07);
    }
    .detail-section:last-child { border-bottom: none; padding-bottom: 10px; }

    .section-title {
      font-size: 7px;
      letter-spacing: 1.5px;
      color: rgba(255,196,0,0.45);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .section-count {
      color: rgba(255,255,255,0.22);
      font-size: 7px;
      letter-spacing: 0;
    }

    .stat-rows { display: flex; flex-direction: column; gap: 3px; }
    .stat-row { display: flex; justify-content: space-between; align-items: baseline; }
    .stat-lbl { font-size: 7.5px; color: rgba(255,255,255,0.35); letter-spacing: 0.3px; }
    .stat-val { font-size: 8.5px; color: var(--gold-4); }
    .stat-val.gold { color: var(--gold-1); }

    .game-breakdown { display: flex; flex-wrap: wrap; gap: 3px 10px; }
    .gs { font-size: 7.5px; }
    .gs-name { color: rgba(255,255,255,0.28); }
    .gs-val  { color: var(--gold-4); }

    /* ── Achievement badges ────────────────────── */
    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .badge {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      cursor: default;
      border: 1.5px solid transparent;
      transition: transform 120ms, box-shadow 120ms;
      flex-shrink: 0;
    }
    .badge:hover { transform: scale(1.12); }

    .badge.rarity-legendary {
      background: linear-gradient(145deg, rgba(90,58,0,0.90) 0%, rgba(55,35,0,0.95) 100%);
      border-color: #ffd700;
      box-shadow: 0 0 10px rgba(255,210,0,0.45), inset 0 1px 0 rgba(255,255,255,0.10);
    }
    .badge.rarity-legendary:hover {
      box-shadow: 0 0 16px rgba(255,210,0,0.70), inset 0 1px 0 rgba(255,255,255,0.10);
    }
    .badge.rarity-epic {
      background: linear-gradient(145deg, rgba(55,0,90,0.90) 0%, rgba(35,0,60,0.95) 100%);
      border-color: #c77dff;
      box-shadow: 0 0 9px rgba(160,80,255,0.45), inset 0 1px 0 rgba(255,255,255,0.08);
    }
    .badge.rarity-epic:hover {
      box-shadow: 0 0 14px rgba(160,80,255,0.70), inset 0 1px 0 rgba(255,255,255,0.08);
    }
    .badge.rarity-rare {
      background: linear-gradient(145deg, rgba(0,35,90,0.90) 0%, rgba(0,22,60,0.95) 100%);
      border-color: #4da6ff;
      box-shadow: 0 0 8px rgba(77,166,255,0.40), inset 0 1px 0 rgba(255,255,255,0.07);
    }
    .badge.rarity-rare:hover {
      box-shadow: 0 0 12px rgba(77,166,255,0.65), inset 0 1px 0 rgba(255,255,255,0.07);
    }
    .badge.rarity-common {
      background: rgba(255,255,255,0.06);
      border-color: rgba(255,255,255,0.16);
    }
    .badge.rarity-common:hover { box-shadow: 0 0 7px rgba(255,255,255,0.15); }
    .badge.locked {
      opacity: 0.15;
      filter: grayscale(1);
      cursor: default;
    }
    .badge.locked:hover { transform: none; box-shadow: none; }

    /* ── Tooltip ───────────────────────────────── */
    .tooltip {
      position: fixed;
      z-index: 9999;
      display: none;
      max-width: 190px;
      padding: 7px 10px 6px;
      background: linear-gradient(180deg, rgba(58,37,14,0.99) 0%, rgba(38,23,8,1.00) 100%);
      border: 1px solid rgba(255,196,0,0.30);
      border-radius: 5px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.60), 0 0 0 1px rgba(0,0,0,0.25);
      pointer-events: none;
      font-family: 'ObelixPro', Arial, sans-serif;
    }
    .tt-rarity { font-size: 6.5px; letter-spacing: 1.2px; margin-bottom: 3px; text-transform: uppercase; }
    .tt-rarity.legendary { color: #ffd700; }
    .tt-rarity.epic      { color: #c77dff; }
    .tt-rarity.rare      { color: #4da6ff; }
    .tt-rarity.common    { color: rgba(255,255,255,0.40); }
    .tt-name  { font-size: 9px; color: var(--gold-1); letter-spacing: 0.4px; margin-bottom: 3px; line-height: 1.2; }
    .tt-desc  { font-size: 7.5px; color: rgba(255,255,255,0.55); line-height: 1.35; }
    .tt-date  { font-size: 6.5px; color: rgba(255,196,0,0.40); margin-top: 4px; letter-spacing: 0.3px; }
    .tt-locked { font-size: 7px; color: rgba(255,255,255,0.25); margin-top: 3px; letter-spacing: 0.5px; }

    /* ── Quest cards ───────────────────────────── */
    .quests-view { display: none; }
    .quests-view.active { display: block; padding-bottom: 8px; }

    .quest-group-label {
      font-size: 7px;
      letter-spacing: 1.5px;
      color: rgba(255, 196, 0, 0.45);
      padding: 9px 14px 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .quest-timer {
      font-size: 6.5px;
      color: rgba(255, 255, 255, 0.22);
      letter-spacing: 0;
      font-variant-numeric: tabular-nums;
    }

    .quest-card {
      margin: 0 10px 6px;
      padding: 9px 10px 8px;
      background: rgba(255, 255, 255, 0.033);
      border-radius: 5px;
      border: 1px solid rgba(255, 196, 0, 0.09);
      border-left: 3px solid rgba(255, 196, 0, 0.38);
    }
    .quest-card.weekly { border-left-color: rgba(199, 125, 255, 0.55); }
    .quest-card.done {
      border-left-color: rgba(80, 220, 120, 0.70);
      background: rgba(80, 220, 120, 0.035);
    }

    .quest-top { display: flex; align-items: flex-start; gap: 8px; }
    .quest-icon { font-size: 20px; line-height: 1; flex-shrink: 0; padding-top: 1px; }
    .quest-meta { flex: 1; min-width: 0; }
    .quest-title {
      font-size: 9px;
      color: var(--gold-1);
      line-height: 1.2;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .quest-desc { font-size: 7px; color: rgba(255,255,255,0.35); line-height: 1.2; }
    .quest-xp {
      font-size: 7.5px;
      color: var(--gold-3);
      flex-shrink: 0;
      white-space: nowrap;
      align-self: center;
      padding-left: 4px;
    }

    .quest-bar-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 7px;
    }
    .quest-track {
      flex: 1;
      height: 3px;
      background: rgba(255,255,255,0.08);
      border-radius: 999px;
      overflow: hidden;
    }
    .quest-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--gold-3), var(--gold-1));
      transition: width 400ms ease;
      min-width: 0;
    }
    .quest-fill.done { background: linear-gradient(90deg, #3ecb70, #7df5a0); }
    .quest-prog { font-size: 6.5px; color: rgba(255,255,255,0.28); white-space: nowrap; font-variant-numeric: tabular-nums; }
    .quest-check { font-size: 6.5px; letter-spacing: 0.5px; color: #7df5a0; flex-shrink: 0; }

    /* ── Footer ────────────────────────────────── */
    .footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 4px 12px 6px;
      font-size: 7px;
      letter-spacing: 0.5px;
      color: rgba(255,255,255,0.18);
      border-top: 1px solid rgba(255,196,0,0.07);
    }
  </style>
</head>
<body>
  <div class="panel">

    <div class="header">
      <span class="header-icon">🏆</span>
      <div class="header-title">LEADERBOARD</div>
    </div>

    <div class="tabs">
      <div class="tab active" data-tab="xp">XP</div>
      <div class="tab" data-tab="wins">WINS</div>
      <div class="tab" data-tab="plays">PLAYS</div>
      <div class="tab" data-tab="quests">QUESTS</div>
    </div>

    <div id="gameFilter" class="game-filter hidden">
      <div class="gf-pill active" data-game="">ALL</div>
      <div class="gf-pill" data-game="quadclaim">QUAD</div>
      <div class="gf-pill" data-game="memoryclaim">MEMORY</div>
      <div class="gf-pill" data-game="gunspleef">GUN</div>
      <div class="gf-pill" data-game="runspleef">RUN</div>
      <div class="gf-pill" data-game="chrono_overdrive">C.OD</div>
      <div class="gf-pill" data-game="chrono_loot_extraction_2d">C.LE</div>
    </div>

    <div class="main-area">

      <div id="listView" class="list-view">
        <div id="rowsWrap" class="rows-wrap">
          <div id="rows" class="rows">
            <div class="placeholder">LOADING…</div>
          </div>
        </div>
      </div>

      <div id="detailView" class="detail-view">
        <div id="detailBack" class="detail-back">
          <span class="detail-back-arrow">←</span> BACK
        </div>
        <div id="detailContent"></div>
      </div>

      <!-- Quests tab view -->
      <div id="questsView" class="quests-view">
        <div id="questsContent"></div>
      </div>

    </div>

    <div id="footer" class="footer">—</div>

  </div>

  <!-- Global tooltip — lives outside panel to avoid clipping -->
  <div id="tooltip" class="tooltip"></div>

  <script>
    /* ── Constants ──────────────────────────────────────────── */
    const SUPABASE_URL = 'https://tpdedcjccygpwkofdyqg.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_kYGFYlXrQHt17-uihwy7tA_CxkbQYNH';
    const POLL_MS = 60_000;

    const BASE_XP = 100, GROWTH = 1.18, ROUNDING = 5, MIN_STEP = 10;
    const xpCache = [0, BASE_XP];

    const GAME_LABELS = {
      quadclaim:                 'Quadclaim',
      memoryclaim:               'Memoryclaim',
      gunspleef:                 'Gunspleef',
      runspleef:                 'Runspleef',
      chrono_overdrive:          'Chrono OD',
      chrono_loot_extraction_2d: 'Chrono LE',
    };

    /* ── State ──────────────────────────────────────────────── */
    let currentTab      = 'xp';
    let currentGame     = '';
    let currentUsername = null;
    let pollHandle      = null;
    let isFetching      = false;

    /* ── DOM ────────────────────────────────────────────────── */
    const gameFilterEl    = document.getElementById('gameFilter');
    const listViewEl      = document.getElementById('listView');
    const rowsWrapEl      = document.getElementById('rowsWrap');
    const rowsEl          = document.getElementById('rows');
    const detailViewEl    = document.getElementById('detailView');
    const detailBackEl    = document.getElementById('detailBack');
    const detailContentEl = document.getElementById('detailContent');
    const questsViewEl    = document.getElementById('questsView');
    const questsContentEl = document.getElementById('questsContent');
    const footerEl        = document.getElementById('footer');
    const tooltipEl       = document.getElementById('tooltip');

    /* ── Supabase ───────────────────────────────────────────── */
    function buildHeaders() {
      return { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY };
    }
    async function callRpc(fn, body) {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
        method: 'POST', headers: buildHeaders(),
        body: JSON.stringify(body), cache: 'no-store'
      });
      const text = await res.text();
      let data; try { data = text ? JSON.parse(text) : null; } catch { data = text; }
      if (!res.ok) throw new Error((data && data.message) || res.statusText);
      return data;
    }

    /* ── Level math ─────────────────────────────────────────── */
    function xpForLevel(l) {
      if (l <= 1) return BASE_XP;
      if (xpCache[l]) return xpCache[l];
      for (let i = xpCache.length; i <= l; i++) {
        const raw = BASE_XP * Math.pow(GROWTH, i - 1);
        const rounded = Math.round(raw / ROUNDING) * ROUNDING;
        xpCache[i] = Math.max(rounded, xpCache[i - 1] + MIN_STEP);
      }
      return xpCache[l];
    }
    function xpToLevel(totalXp) {
      const xp = Math.max(0, Number(totalXp) || 0);
      let level = 1, rem = xp, need = xpForLevel(level);
      while (rem >= need) { rem -= need; level++; need = xpForLevel(level); }
      return level;
    }

    /* ── Helpers ────────────────────────────────────────────── */
    function apiCat() {
      if (currentTab === 'xp') return 'xp';
      return currentGame ? `${currentTab}_${currentGame}` : currentTab;
    }
    function fmtValue(val, cat) {
      const n = Number(val) || 0, s = n.toLocaleString();
      if (!cat || cat === 'xp')   return s + ' XP';
      if (cat.startsWith('wins')) return s + ' W';
      return s + ' P';
    }
    function esc(str) {
      return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
    function rankIcon(n) {
      if (n === 1) return '🥇'; if (n === 2) return '🥈'; if (n === 3) return '🥉';
      return n;
    }
    function rankCls(n) {
      if (n === 1) return 'rank-1'; if (n === 2) return 'rank-2'; if (n === 3) return 'rank-3';
      return 'rank-other';
    }
    function relTime(iso) {
      if (!iso) return '—';
      const diff = Date.now() - new Date(iso).getTime(), m = Math.floor(diff / 60000);
      if (m < 1)  return 'just now';
      if (m < 60) return `${m}m ago`;
      const h = Math.floor(m / 60);
      if (h < 24) return `${h}h ago`;
      return `${Math.floor(h / 24)}d ago`;
    }
    function fmtDate(iso) {
      if (!iso) return '—';
      return new Date(iso).toLocaleDateString([], { month: 'short', year: 'numeric' });
    }
    function fmtGame(key) { return GAME_LABELS[key] || key || '—'; }

    function formatTimeLeft(isoStr) {
      if (!isoStr) return '';
      const ms = new Date(isoStr).getTime() - Date.now();
      if (ms <= 0) return 'expired';
      const totalMins = Math.floor(ms / 60000);
      const days  = Math.floor(totalMins / 1440);
      const hours = Math.floor((totalMins % 1440) / 60);
      const mins  = totalMins % 60;
      if (days > 0)  return `${days}d ${hours}h`;
      if (hours > 0) return `${hours}h ${mins}m`;
      return `${mins}m`;
    }

    /* ── Tooltip ────────────────────────────────────────────── */
    function positionTooltip(cx, cy) {
      tooltipEl.style.visibility = 'hidden';
      tooltipEl.style.display = 'block';
      const tw = tooltipEl.offsetWidth, th = tooltipEl.offsetHeight;
      tooltipEl.style.visibility = '';
      let x = cx + 12, y = cy - th - 10;
      if (x + tw > window.innerWidth  - 6) x = cx - tw - 12;
      if (y < 6)                           y = cy + 16;
      if (y + th > window.innerHeight - 6) y = window.innerHeight - th - 6;
      tooltipEl.style.left = x + 'px';
      tooltipEl.style.top  = y + 'px';
    }

    function showTooltip(e, ach) {
      const earned  = !!ach.earned_at;
      const rareLbl = ach.rarity.charAt(0).toUpperCase() + ach.rarity.slice(1);
      let html = `<div class="tt-rarity ${ach.rarity}">${rareLbl}</div>`;
      html    += `<div class="tt-name">${esc(ach.name)}</div>`;
      html    += `<div class="tt-desc">${esc(ach.description)}</div>`;
      if (earned) {
        html += `<div class="tt-date">Earned ${fmtDate(ach.earned_at)}</div>`;
      } else {
        html += `<div class="tt-locked">🔒 NOT YET EARNED</div>`;
      }
      tooltipEl.innerHTML = html;
      positionTooltip(e.clientX, e.clientY);
    }
    function hideTooltip() { tooltipEl.style.display = 'none'; }

    /* ── Quest card rendering ───────────────────────────────── */
    function questCardHtml(q) {
      const prog   = Number(q.progress)     || 0;
      const target = Number(q.target_value) || 1;
      const done   = !!q.completed;
      const pct    = Math.min(100, Math.round((prog / target) * 100));
      // Only render progress bar when we have player context (get_player_quests returns `progress`)
      const hasCtx = q.progress !== undefined && q.progress !== null;

      return `
        <div class="quest-card ${q.quest_type}${done ? ' done' : ''}">
          <div class="quest-top">
            <div class="quest-icon">${esc(q.icon)}</div>
            <div class="quest-meta">
              <div class="quest-title">${esc(q.title)}</div>
              <div class="quest-desc">${esc(q.description)}</div>
            </div>
            <div class="quest-xp">+${Number(q.xp_reward).toLocaleString()} XP</div>
          </div>
          ${hasCtx ? `
            <div class="quest-bar-row">
              <div class="quest-track">
                <div class="quest-fill${done ? ' done' : ''}" style="width:${pct}%"></div>
              </div>
              <div class="quest-prog">${prog.toLocaleString()}/${target.toLocaleString()}</div>
              ${done ? '<div class="quest-check">✓ DONE</div>' : ''}
            </div>` : ''}
        </div>`;
    }

    function renderQuestCards(quests) {
      const weekly = quests.filter(q => q.quest_type === 'weekly');
      const daily  = quests.filter(q => q.quest_type === 'daily');
      let html = '';

      if (weekly.length) {
        html += `<div class="quest-group-label">WEEKLY QUESTS
          <span class="quest-timer">Resets in ${esc(formatTimeLeft(weekly[0].active_until))}</span>
        </div>`;
        for (const q of weekly) html += questCardHtml(q);
      }
      if (daily.length) {
        html += `<div class="quest-group-label">DAILY QUESTS
          <span class="quest-timer">Resets in ${esc(formatTimeLeft(daily[0].active_until))}</span>
        </div>`;
        for (const q of daily) html += questCardHtml(q);
      }

      return html || '<div class="placeholder">NO ACTIVE QUESTS</div>';
    }

    /* ── Quests tab loader ──────────────────────────────────── */
    async function loadQuests() {
      questsContentEl.innerHTML = '<div class="placeholder">LOADING…</div>';
      try {
        let quests;
        if (currentUsername) {
          // Personalised: shows progress bars
          const raw = await callRpc('get_player_quests', { p_username: currentUsername });
          quests = Array.isArray(raw) ? raw : [];
        } else {
          // Anonymous: shows quest info only
          const raw = await callRpc('get_active_quests', {});
          quests = Array.isArray(raw) ? raw : [];
        }
        questsContentEl.innerHTML = renderQuestCards(quests);
      } catch (err) {
        console.error('Quest fetch failed:', err);
        questsContentEl.innerHTML = '<div class="placeholder">FETCH ERROR</div>';
      }
    }

    /* ── Render list ────────────────────────────────────────── */
    function renderRows(rows, ownRank) {
      if (!rows || rows.length === 0) {
        rowsEl.innerHTML = '<div class="placeholder">NO DATA YET</div>';
        return;
      }
      const cat = apiCat(), meInTop = rows.some(r => r.username === currentUsername);
      let html = '';
      for (const r of rows) {
        const rank = Number(r.rank), isMe = r.username === currentUsername;
        html += `
          <div class="row${isMe ? ' is-me' : ''}" data-username="${esc(r.username)}" data-rank="${rank}">
            <div class="row-rank ${rankCls(rank)}">${rankIcon(rank)}</div>
            <div class="row-name">${esc(r.username)}${isMe ? '<span class="you-tag">(you)</span>' : ''}</div>
            <div class="row-value">${fmtValue(r.value, cat)}</div>
            <div class="row-chevron">›</div>
          </div>`;
      }
      if (!meInTop && ownRank && currentUsername) {
        html += `
          <div class="own-rank-sep"></div>
          <div class="own-rank-row" data-username="${esc(currentUsername)}" data-rank="${Number(ownRank.rank)}">
            <div class="row-rank">${Number(ownRank.rank).toLocaleString()}</div>
            <div class="row-name">${esc(currentUsername)}<span class="you-tag">(you)</span></div>
            <div class="row-value">${fmtValue(ownRank.value, cat)}</div>
          </div>`;
      }
      rowsEl.innerHTML = html;
      rowsEl.querySelectorAll('[data-username]').forEach(el => {
        el.addEventListener('click', () => openDetail(el.dataset.username, Number(el.dataset.rank)));
      });
    }

    /* ── Render badges ──────────────────────────────────────── */
    function renderBadges(achs) {
      const earned = achs.filter(a => !!a.earned_at);
      const locked = achs.filter(a => !a.earned_at);
      const total  = achs.length;
      const container = document.getElementById('badgesSection');
      if (!container) return;

      const countEl = container.querySelector('.section-count');
      if (countEl) countEl.textContent = `${earned.length} / ${total}`;

      const grid = container.querySelector('.badges');
      if (!grid) return;

      const all = [...earned, ...locked];
      grid.innerHTML = '';

      for (const ach of all) {
        const isLocked = !ach.earned_at;
        const div = document.createElement('div');
        div.className = `badge rarity-${ach.rarity}${isLocked ? ' locked' : ''}`;
        div.textContent = ach.icon;
        div.title = '';
        div.addEventListener('mouseenter', (e) => showTooltip(e, ach));
        div.addEventListener('mousemove',  (e) => positionTooltip(e.clientX, e.clientY));
        div.addEventListener('mouseleave', hideTooltip);
        grid.appendChild(div);
      }
    }

    /* ── Detail view ────────────────────────────────────────── */
    async function openDetail(username, rank) {
      listViewEl.classList.add('hidden');
      detailViewEl.classList.add('active');
      detailContentEl.innerHTML = '<div class="placeholder">LOADING…</div>';

      try {
        const [raw, achsRaw, questsRaw] = await Promise.all([
          callRpc('get_player_stats',        { p_username: username }),
          callRpc('get_player_achievements', { p_username: username }),
          callRpc('get_player_quests',       { p_username: username })
        ]);

        const p      = Array.isArray(raw)       ? raw[0]      : raw;
        const achs   = Array.isArray(achsRaw)   ? achsRaw     : [];
        const quests = Array.isArray(questsRaw) ? questsRaw   : [];

        if (!p) { detailContentEl.innerHTML = '<div class="placeholder">NOT FOUND</div>'; return; }

        const totalWins  = (Number(p.wins_quadclaim)||0)  + (Number(p.wins_memoryclaim)||0)
                         + (Number(p.wins_gunspleef)||0)  + (Number(p.wins_runspleef)||0);
        const totalPlays = (Number(p.plays_quadclaim)||0) + (Number(p.plays_memoryclaim)||0)
                         + (Number(p.plays_gunspleef)||0) + (Number(p.plays_runspleef)||0)
                         + (Number(p.plays_chrono_overdrive)||0)
                         + (Number(p.plays_chrono_loot_extraction_2d)||0);

        const level   = xpToLevel(p.xp);
        const streak  = Number(p.daily_login_streak) || 0;
        const best    = Number(p.best_login_streak)  || 0;
        const cat     = apiCat();
        const catLbl  = cat === 'xp' ? 'XP' : cat.startsWith('wins') ? 'WINS' : 'PLAYS';
        const earnedCount = achs.filter(a => !!a.earned_at).length;
        const questsDone  = quests.filter(q => q.completed).length;

        const winsBreakdown = ['quadclaim','memoryclaim','gunspleef','runspleef']
          .map(g => `<span class="gs"><span class="gs-name">${GAME_LABELS[g]} </span><span class="gs-val">${Number(p['wins_'+g])||0}</span></span>`)
          .join('');

        const playsBreakdown = Object.keys(GAME_LABELS)
          .map(g => `<span class="gs"><span class="gs-name">${GAME_LABELS[g]} </span><span class="gs-val">${Number(p['plays_'+g])||0}</span></span>`)
          .join('');

        detailContentEl.innerHTML = `
          <div class="detail-hero">
            <div class="detail-name">${esc(username)}</div>
            <div class="detail-sub">Level ${level}&nbsp;&nbsp;·&nbsp;&nbsp;<span class="hl">#${rank.toLocaleString()} ${catLbl}</span></div>
          </div>

          <div class="detail-section">
            <div class="section-title">STATS</div>
            <div class="stat-rows">
              <div class="stat-row"><div class="stat-lbl">TOTAL XP</div><div class="stat-val gold">${(Number(p.xp)||0).toLocaleString()}</div></div>
              <div class="stat-row"><div class="stat-lbl">TOTAL WINS</div><div class="stat-val">${totalWins.toLocaleString()}</div></div>
              <div class="stat-row"><div class="stat-lbl">TOTAL PLAYS</div><div class="stat-val">${totalPlays.toLocaleString()}</div></div>
              <div class="stat-row"><div class="stat-lbl">FAVORITE GAME</div><div class="stat-val">${esc(fmtGame(p.favorite_game))}</div></div>
              <div class="stat-row"><div class="stat-lbl">LOGIN STREAK</div><div class="stat-val">${streak > 0 ? '🔥 ' + streak + ' day' + (streak !== 1 ? 's' : '') : '—'}</div></div>
              <div class="stat-row"><div class="stat-lbl">BEST STREAK</div><div class="stat-val">${best > 0 ? best + ' day' + (best !== 1 ? 's' : '') : '—'}</div></div>
              <div class="stat-row"><div class="stat-lbl">LAST SEEN</div><div class="stat-val">${relTime(p.last_seen_at)}</div></div>
              <div class="stat-row"><div class="stat-lbl">MEMBER SINCE</div><div class="stat-val">${fmtDate(p.created_at)}</div></div>
            </div>
          </div>

          <div class="detail-section">
            <div class="section-title">ACTIVE QUESTS <span class="section-count">${questsDone} / ${quests.length} done</span></div>
            <div id="detailQuestCards">${quests.length ? renderQuestCards(quests) : '<div class="placeholder-sm">No active quests</div>'}</div>
          </div>

          <div class="detail-section" id="badgesSection">
            <div class="section-title">
              ACHIEVEMENTS
              <span class="section-count">${earnedCount} / ${achs.length}</span>
            </div>
            <div class="badges"></div>
          </div>

          <div class="detail-section">
            <div class="section-title">WINS BY GAME</div>
            <div class="game-breakdown">${winsBreakdown}</div>
          </div>

          <div class="detail-section">
            <div class="section-title">PLAYS BY GAME</div>
            <div class="game-breakdown">${playsBreakdown}</div>
          </div>
        `;

        renderBadges(achs);

      } catch (err) {
        console.error('Detail fetch failed:', err);
        detailContentEl.innerHTML = '<div class="placeholder">FETCH ERROR</div>';
      }
    }

    function closeDetail() {
      hideTooltip();
      detailViewEl.classList.remove('active');
      if (currentTab === 'quests') {
        questsViewEl.classList.add('active');
      } else {
        listViewEl.classList.remove('hidden');
      }
    }

    detailBackEl.addEventListener('click', closeDetail);

    /* ── Fetch & refresh ────────────────────────────────────── */
    async function refresh() {
      if (isFetching || currentTab === 'quests') return;
      isFetching = true;
      try {
        const cat = apiCat();
        const [rows, ownRankRaw] = await Promise.all([
          callRpc('get_leaderboard', { p_category: cat, p_limit: 10 }),
          currentUsername
            ? callRpc('get_player_rank', { p_username: currentUsername, p_category: cat })
                .then(d => Array.isArray(d) ? d[0] : d).catch(() => null)
            : Promise.resolve(null)
        ]);
        renderRows(Array.isArray(rows) ? rows : [], ownRankRaw || null);
        const t = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        footerEl.textContent = 'UPDATED ' + t;
      } catch (err) {
        console.error('Leaderboard fetch failed:', err);
        rowsEl.innerHTML = '<div class="placeholder">FETCH ERROR</div>';
      } finally {
        isFetching = false;
      }
    }

    function startPolling() {
      if (pollHandle) clearInterval(pollHandle);
      pollHandle = setInterval(() => {
        if (currentTab === 'quests') loadQuests();
        else refresh();
      }, POLL_MS);
    }

    /* ── Tab switching ──────────────────────────────────────── */
    async function switchTab(tab) {
      if (tab === currentTab) return;
      currentTab = tab;
      currentGame = '';

      document.querySelectorAll('.tab').forEach(t =>
        t.classList.toggle('active', t.dataset.tab === tab)
      );

      const isQuests = tab === 'quests';

      // Show/hide game filter (only visible for wins/plays)
      gameFilterEl.classList.toggle('hidden', tab === 'xp' || isQuests);

      // Show/hide list vs quests view
      questsViewEl.classList.toggle('active', isQuests);
      listViewEl.classList.toggle('hidden', isQuests);

      if (!isQuests) {
        document.querySelectorAll('.gf-pill').forEach(p =>
          p.classList.toggle('active', p.dataset.game === '')
        );
      }

      // Always close detail when switching tabs
      hideTooltip();
      detailViewEl.classList.remove('active');

      if (isQuests) {
        await loadQuests();
      } else {
        rowsWrapEl.classList.add('fading');
        await refresh();
        rowsWrapEl.classList.remove('fading');
      }
    }

    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => switchTab(tab.dataset.tab));
    });

    /* ── Game filter ────────────────────────────────────────── */
    async function switchGame(game) {
      if (game === currentGame) return;
      currentGame = game;
      document.querySelectorAll('.gf-pill').forEach(p =>
        p.classList.toggle('active', p.dataset.game === game)
      );
      hideTooltip();
      detailViewEl.classList.remove('active');
      listViewEl.classList.remove('hidden');
      rowsWrapEl.classList.add('fading');
      await refresh();
      rowsWrapEl.classList.remove('fading');
    }

    document.querySelectorAll('.gf-pill').forEach(pill => {
      pill.addEventListener('click', () => switchGame(pill.dataset.game));
    });

    /* ── Portals message ────────────────────────────────────── */
    function extractUsername(raw) {
      try {
        const msg = String(raw || '').trim();
        try { const p = JSON.parse(msg); if (p && p.username) return String(p.username).trim(); } catch {}
        const norm = msg.replace(/=\s*(?=[\[{"'\-\dtruefalsen])/g, ':');
        try { const p = JSON.parse(norm); if (p && p.username) return String(p.username).trim(); } catch {}
        const m = msg.match(/username\s*[=:]\s*["']?([^\s"';,}]+)/i);
        return m ? m[1].trim() : null;
      } catch { return null; }
    }

    async function handlePortalsMessage(message) {
      try {
        const username = extractUsername(message);
        const prevUsername = currentUsername;
        if (username) currentUsername = username;

        if (currentTab === 'quests') {
          // Re-render quests with personalised data once username is known
          if (username && username !== prevUsername) await loadQuests();
        } else {
          await refresh();
        }
        startPolling();
      } catch (err) { console.error('Portals message handling failed:', err); }
    }

    window.handlePortalsMessage = handlePortalsMessage;

    /* ── Boot ───────────────────────────────────────────────── */
    refresh();
    startPolling();
    PortalsSdk.setMessageListener(msg => handlePortalsMessage(msg));
  </script>
</body>
</html>
